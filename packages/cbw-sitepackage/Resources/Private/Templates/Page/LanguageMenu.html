<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="LanguageMenu"/>
<f:section name="Main">
    <f:if condition="{languageMenu.1.available}">
        <nav class="language-menu">
            <div class="language-selector">

                <!-- TOGGLE -->
                <div class="language-toggle">
                    <button type="button" aria-haspopup="true" aria-expanded="false">
                <span class="language-flag">
                    <img src="{activeLanguage.flag}" alt="" class="flag-icon">
                </span>
                        <span class="language-label">
                    <f:translate key="LLL:EXT:cbw_sitepackage/Resources/Private/Language/locallang.xlf:languages.{activeLanguage.twoLetterIsoCode}" />
                </span>
                        <span class="dropdown-arrow"></span>
                    </button>
                </div>

                <!-- DROPDOWN -->
                <ul class="language-dropdown-menu">
                    <f:for each="{languageMenu}" as="language">
                        <f:if condition="{language.active}">
                            <f:else>
                                <li class="language-item">
                                    <f:link.typolink
                                            parameter="{language.link}"
                                            additionalAttributes="{hreflang:'{language.hreflang}'}"
                                            title="{language.title}">
                                <span class="language-flag">
                                    <img src="{language.flag}" alt="" class="flag-icon">
                                </span>
                                        <span class="language-label">
                                    <f:translate key="LLL:EXT:cbw_sitepackage/Resources/Private/Language/locallang.xlf:languages.{language.twoLetterIsoCode}" />
                                </span>
                                    </f:link.typolink>
                                </li>
                            </f:else>
                        </f:if>
                    </f:for>
                </ul>

            </div>
        </nav>

    </f:if>
</f:section>
</html>
