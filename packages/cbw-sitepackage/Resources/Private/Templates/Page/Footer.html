<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Footer"/>
<f:section name="Main">
    <footer>
        <section class="footer">
            <div class="container">
                <div class="row">
                    <h3>Kontakt</h3>
                    <div class="col-md-4">
                        <div class="footer-left footer-section">
                            <img src="{normalizedParams.siteUrl}{f:uri.resource(path: 'EXT:cbw_sitepackage/Resources/Public/images/bjoern-kinne-202w.jpg')}" class="footer-img" width="100" alt="Foto des geschäftsführendem Gesellschafter Björn Kinne" title="Geschäftsführender Gesellschafter Björn Kinne" />
                            <p>Björn Kinne</p>
                            <p>Geschäftsführender Gesellschafter</p>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="footer-middle footer-section">
                            <div class="footer-contact">
                                <p>Mobil: +49(0)1772737881</p>
                                <p>E-Mail: info@psacontrols.com</p>
                            </div>
                           <div class="footer-address">
                               <p>PSAControls GmbH</p>
                               <p>Hardenbergstraße 60</p>
                               <p>04275 Leipzig</p>
                               <br/>
                           </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="footer-right footer-section">
                            <f:cObject typoscriptObjectPath="lib.menu-footer" />
                            <f:format.raw>{menu-language}</f:format.raw>

                            <div class="row align-items-center copyright-menu-section">
                                <div class="col-lg-12">
                                    <div id="copyright">
                                        <f:format.raw>{copyright}</f:format.raw>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </footer>
</f:section>
</html>
